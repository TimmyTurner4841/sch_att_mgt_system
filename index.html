<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redeemers Private School</title>
<link rel="icon" href="logo.png">
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,sans-serif;color:#14213d;background:#f4f7fc}
a{color:#1e4fa3}header{background:#fff;border-bottom:3px solid #1e4fa3;position:sticky;top:0;z-index:5}
.in{max-width:900px;margin:0 auto;padding:0 14px}.top{display:flex;align-items:center;gap:10px;padding:8px 0}
.top img{height:48px}.top b{font-size:17px;color:#1e4fa3;line-height:1.15}.top small{display:block;color:#667;font-size:12px}
.top .btn{margin:0 0 0 auto;padding:7px 10px;font-size:13px;white-space:nowrap}nav{display:flex;overflow-x:auto;gap:2px}nav a{padding:10px 14px;text-decoration:none;color:#14213d;font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
nav a.on{color:#1e4fa3;border-color:#1e4fa3}
.hero{background:linear-gradient(135deg,#1e4fa3,#12306b);color:#fff;text-align:center;padding:36px 16px}
.hero img{height:120px;background:#fff;border-radius:14px;padding:6px}.hero h1{margin:12px 0 4px;font-size:28px}.hero p{margin:0 0 16px;opacity:.9;font-style:italic}
.chip{display:inline-block;background:#e3ecfb;color:#1e4fa3;font-weight:600;padding:6px 14px;border-radius:20px;margin:4px 4px 4px 0}
.grid.t{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.tc{text-align:center}.tc img,.ph{width:110px;height:110px;border-radius:50%;object-fit:cover;margin:0 auto 8px;display:block}
.ph{background:#e3ecfb;color:#1e4fa3;font-size:40px;font-weight:700;display:flex;align-items:center;justify-content:center}.role{color:#1e4fa3;font-weight:600;margin:0;font-size:14px}
.btn{display:inline-block;background:#1e4fa3;color:#fff!important;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:600;margin:4px}
.hero .btn{background:#fff;color:#1e4fa3!important}.hero .btn.g{background:#25d366;color:#fff!important}
main{padding:18px 0 30px}h2{color:#1e4fa3;margin:22px 0 10px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px #0001;overflow:hidden}
.card h3{margin:2px 0 6px;font-size:18px}.card small{color:#667}.pi{width:calc(100% + 28px);margin:-14px -14px 10px;max-height:220px;object-fit:cover}
.body{white-space:pre-line;margin:6px 0}summary{cursor:pointer;color:#1e4fa3;font-weight:600}
footer{background:#12306b;color:#cfe0ff;text-align:center;padding:18px;font-size:14px}footer a{color:#fff}
</style></head><body>
<header><div class=in><div class=top><img src=logo.png alt=""><div><b>Redeemers Private School</b><small>Knowledge and the Fear of God</small></div><a class=btn href="staff.html">🔒 Staff Portal</a></div>
<nav id=nav></nav></div></header>
<div id=app></div>
<footer>© <span id=yr></span> Redeemers Private School · Opp. Iyakwari Hotel, Holiness Road, Ado, New Karu<br><a href="staff.html">Staff login</a></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== SETTINGS: same two Supabase values as staff.html ======
const URL_='https://lcipveuaxjiilvqymqob.supabase.co', KEY='sb_publishable_pOFn7CtPewesWKGpQUo6MA_o-MJ_tyZ';
const SOCIAL={Facebook:'',Instagram:''};   // add your page links, e.g. Facebook:'https://facebook.com/yourpage'
// ====== ABOUT US: fill these in. Anything left empty ('' or []) is simply not shown ======
const ABOUT={
 story:'',                 // Our story / brief history of the school
 mission:'',               // Mission statement
 vision:'',                // Vision statement
 values:[],                // e.g. ['Godliness','Excellence','Discipline']
 principalName:'',         // e.g. 'Mrs A. Adeyemi, Principal'
 principal:''              // A short welcome message from the Principal
};
// ==============================================================
if(!/^https:\/\/.+\.supabase\.co/.test(URL_)||KEY.startsWith('PASTE')){document.body.innerHTML='<p style="padding:24px;font:16px system-ui"><b>Setup needed:</b> paste your Supabase URL and key into the settings lines at the top of this file (keep the quote marks), then upload it again.</p>';throw new Error('Supabase settings missing')}
const {createClient}=supabase,db=createClient(URL_,KEY),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safe=u=>/^https?:\/\//.test(u||'')?esc(u):'#';
const fmt=d=>new Date(d).toLocaleDateString('en-NG',{day:'numeric',month:'long',year:'numeric'});
const PH=['08140418681','08035837010'],WA='2348140418681';
let P=[],TM=[];const of=t=>P.filter(p=>p.type==t);
const card=(p,blog)=>`<article class=card>${p.image_url?`<img class=pi src="${safe(p.image_url)}" alt="">`:''}<small>${fmt(p.created_at)}</small><h3>${esc(p.title)}</h3>
${blog?`<p class=body>${esc(p.body.slice(0,140))}${p.body.length>140?'…':''}</p>${p.body.length>140?`<details><summary>Read more</summary><p class=body>${esc(p.body)}</p></details>`:''}`:`<p class=body>${esc(p.body)}</p>`}
${p.link_url?`<a class=btn href="${safe(p.link_url)}" target=_blank rel=noopener>View original post</a>`:''}</article>`;
const list=(t,blog,empty)=>of(t).map(p=>card(p,blog)).join('')||`<p>${empty}</p>`;
const V={
 home:()=>`<div class=hero><img src=logo.png alt=""><h1>Redeemers Private School</h1><p>Knowledge and the Fear of God</p>
  <a class=btn href="tel:${PH[0]}">📞 Call us</a><a class="btn g" href="https://wa.me/${WA}">WhatsApp</a></div>
  <div class=in><main><h2>Latest announcements</h2><div class=grid>${of('announcement').slice(0,3).map(p=>card(p)).join('')||'<p>No announcements yet.</p>'}</div>
  <h2>From our blog</h2><div class=grid>${of('blog').slice(0,2).map(p=>card(p,1)).join('')||'<p>No posts yet.</p>'}</div></main></div>`,
 news:()=>`<div class=in><main><h2>Announcements</h2><div class=grid>${list('announcement',0,'No announcements yet.')}</div></main></div>`,
 blog:()=>`<div class=in><main><h2>Blog</h2><div class=grid>${list('blog',1,'No blog posts yet.')}</div></main></div>`,
 social:()=>`<div class=in><main><h2>Social</h2><div class=grid>${list('social',0,'No social posts yet.')}</div>
  <p>${Object.entries(SOCIAL).filter(([,u])=>u).map(([n,u])=>`<a class=btn href="${safe(u)}" target=_blank rel=noopener>Follow on ${n}</a>`).join('')}</p></main></div>`,
 team:()=>{const g=(c,h)=>{const m=TM.filter(x=>x.category==c);return m.length?`<h2>${h}</h2><div class="grid t">${m.map(x=>`<div class="card tc">${x.photo_url?`<img src="${safe(x.photo_url)}" alt="">`:`<div class=ph>${esc(x.name.trim()[0]||'?')}</div>`}<h3>${esc(x.name)}</h3><p class=role>${esc(x.role)}</p></div>`).join('')}</div>`:''};
  return `<div class=in><main>${g('management','Meet the Management')+g('staff','Meet Our Staff')||'<h2>Our Team</h2><p>Coming soon.</p>'}</main></div>`},
 about:()=>`<div class=in><main><h2>About Us</h2>
  <div class=card><p><b>Our motto</b><br><i>Knowledge and the Fear of God</i></p>${ABOUT.story?`<p class=body>${esc(ABOUT.story)}</p>`:''}</div>
  ${ABOUT.mission||ABOUT.vision?`<div class=grid style="margin-top:14px">${ABOUT.mission?`<div class=card><h3>Our Mission</h3><p class=body>${esc(ABOUT.mission)}</p></div>`:''}${ABOUT.vision?`<div class=card><h3>Our Vision</h3><p class=body>${esc(ABOUT.vision)}</p></div>`:''}</div>`:''}
  ${ABOUT.values.length?`<h2>Our Core Values</h2><div class=card>${ABOUT.values.map(v=>`<span class=chip>${esc(v)}</span>`).join('')}</div>`:''}
  ${ABOUT.principal?`<h2>Message from the Principal</h2><div class=card><p class=body>${esc(ABOUT.principal)}</p>${ABOUT.principalName?`<b>— ${esc(ABOUT.principalName)}</b>`:''}</div>`:''}
  <h2>Contact us</h2><div class=card><p><b>Address</b><br>Opp. Iyakwari Hotel, Holiness Road, Ado, New Karu.</p>
  <p><b>Phone</b><br>${PH.map(n=>`<a href="tel:${n}">${n}</a>`).join(' · ')}</p>
  <a class="btn" style="background:#25d366" href="https://wa.me/${WA}">Chat on WhatsApp</a>
  <a class=btn href="https://www.google.com/maps/search/?api=1&query=Iyakwari+Hotel+Ado+New+Karu" target=_blank rel=noopener>View on map</a></div></main></div>`};
const NAV=[['home','Home'],['news','Announcements'],['blog','Blog'],['social','Social'],['team','Our Team'],['about','About Us']];
function show(){let k=location.hash.slice(1);if(k=='contact')k='about';const v=V[k]?k:'home';
  $('#nav').innerHTML=NAV.map(([i,l])=>`<a href="#${i}" class="${i==v?'on':''}">${l}</a>`).join('');$('#app').innerHTML=V[v]();scrollTo(0,0)}
$('#yr').textContent=new Date().getFullYear();
addEventListener('hashchange',show);
Promise.all([db.from('posts').select('*').eq('published',true).order('created_at',{ascending:false}).limit(60),db.from('team').select('*').order('sort_order').order('created_at')]).then(([r,t])=>{P=r.data||[];TM=t.data||[];show()});show();
</script></body></html>
