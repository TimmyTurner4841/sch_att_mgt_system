<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staff Portal · Redeemers Private School</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#eef3fb;color:#14213d}
header{background:#1e4fa3;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header button{background:#fff;color:#1e4fa3;border:0;border-radius:6px;padding:6px 10px;font-weight:600}
main,.box{max-width:720px;margin:0 auto;padding:12px}.box{padding-top:30px}
h1{color:#1e4fa3;text-align:center;font-size:22px}h3{margin:0 0 8px;color:#1e4fa3}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
input,select,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid #c5d3ea;border-radius:8px;font:inherit;background:#fff}
label{font-size:12px;color:#557}button{font:inherit;cursor:pointer}
.pri{width:100%;background:#1e4fa3;color:#fff;border:0;border-radius:8px;padding:12px;font-weight:600;margin-top:6px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:10px 4px;font-size:13px;border:1px solid #1e4fa3;background:#fff;color:#1e4fa3;border-radius:8px;font-weight:600}
.tabs button.on{background:#1e4fa3;color:#fff}
.clock{font-size:34px;font-weight:700;text-align:center;color:#1e4fa3}.st{text-align:center;margin:4px 0 12px}
.big{width:100%;padding:26px;font-size:24px;font-weight:800;border:0;border-radius:14px;color:#fff;background:#999}
.big.in{background:#1e4fa3}.big.out{background:#c0392b}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.c{background:#fff;border-radius:12px;padding:12px;text-align:center;font-size:12px;color:#557}.c b{display:block;font-size:28px;color:#1e4fa3}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #eef}small{display:block;color:#667;font-size:12px}
.tag{font-style:normal;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;height:fit-content;text-transform:uppercase;background:#dde6f5;color:#1e4fa3}
.present,.approved{background:#d8f3e0;color:#157a3c}.late,.pending{background:#fff0cf;color:#a66a00}.absent,.rejected{background:#fde0de;color:#b3261e}.leave{background:#dde6f5}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px 6px;text-align:left;border-bottom:1px solid #eef;white-space:nowrap}th{color:#1e4fa3}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mini{padding:8px 12px;border:0;border-radius:6px;color:#fff;font-weight:600}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14213d;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== SETTINGS: paste your Supabase values (Project Settings > API) ======
const URL_='https://lcipveuaxjiilvqymqob.supabase.co', KEY='sb_publishable_pOFn7CtPewesWKGpQUo6MA_o-MJ_tyZ';
const DEPTS=['Teaching','Non-teaching'];
// ==========================================================================
if(!/^https:\/\/.+\.supabase\.co/.test(URL_)||KEY.startsWith('PASTE')){document.body.innerHTML='<p style="padding:24px;font:16px system-ui"><b>Setup needed:</b> paste your Supabase URL and key into the settings lines at the top of this file (keep the quote marks), then upload it again.</p>';throw new Error('Supabase settings missing')}
const {createClient}=supabase, db=createClient(URL_,KEY), $=s=>document.querySelector(s), tz='Africa/Lagos';
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:tz});
const tm=t=>t?new Date(t).toLocaleTimeString('en-NG',{timeZone:tz,hour:'2-digit',minute:'2-digit'}):'–';
const em=i=>i.trim().toLowerCase().replace(/[^a-z0-9]/g,'-')+'@school-staff.app';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=e=>Object.fromEntries(new FormData(e.target));
const render=h=>$('#app').innerHTML=h;
let me,T,TM=[],P=[],S=[],AT=[],LV=[],A={tab:'today',date:today(),q:'',dept:''};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2800)}
const hdr=t=>`<header><span style="display:flex;align-items:center;gap:8px"><img src=logo.png alt="" style="height:36px;background:#fff;border-radius:6px"><span><b style="font-size:14px">Redeemers Private School</b><small style="color:#cfe0ff">${esc(t)}</small></span></span><button onclick="logout()">Logout</button></header>`;
async function logout(){await db.auth.signOut();me=null;authView()}
async function init(){
  const {data:{session}}=await db.auth.getSession();if(!session)return authView();
  const {data}=await db.from('staff').select('*').eq('id',session.user.id).maybeSingle();
  if(!data){await db.auth.signOut();return authView()}
  me=data;me.role=='admin'?adminView():staffView()}

// ---------- Login / Register ----------
function authView(m='login'){const r=m=='reg';
  render(`<div class=box><div style="text-align:center"><img src=logo.png alt="" style="height:90px"></div><h1>Redeemers Private School<br><small>Staff Attendance Portal</small></h1><div class=tabs>
  <button class="${r?'':'on'}" onclick="authView('login')">Login</button><button class="${r?'on':''}" onclick="authView('reg')">Register</button></div>
  <form class=card onsubmit="auth(event,${r});return false">
  ${r?`<input name=full_name placeholder="Full name" required><input name=phone type=tel placeholder="Phone number" required>`:''}
  <input name=sid placeholder="Staff ID" required autocapitalize=off>
  ${r?`<select name=department required><option value="">Select department</option>${DEPTS.map(d=>`<option>${d}</option>`).join('')}</select>`:''}
  <input name=pw type=password placeholder="Password (min. 6 characters)" minlength=6 required>
  <button class=pri>${r?'Create account':'Login'}</button><p id=msg></p></form><p style="text-align:center"><a href="./">← School website</a></p></div>`)}
async function auth(e,reg){const f=fd(e),msg=$('#msg');msg.textContent='Please wait…';const email=em(f.sid);
  const r=reg?await db.auth.signUp({email,password:f.pw,options:{data:{full_name:f.full_name.trim(),phone:f.phone,staff_id:f.sid.trim(),department:f.department}}})
    :await db.auth.signInWithPassword({email,password:f.pw});
  if(r.error){const x=r.error.message;msg.textContent=/Database error|already/i.test(x)?'This Staff ID is already registered.':/Invalid login/i.test(x)?'Wrong Staff ID or password.':x;return}
  if(!r.data.session){msg.textContent='Account created. Please login.';return}init()}

// ---------- Staff ----------
async function staffView(){
  const [a,l]=await Promise.all([db.from('attendance').select('*').eq('staff_id',me.id).order('date',{ascending:false}).limit(90),
    db.from('leave_requests').select('*').eq('staff_id',me.id).order('created_at',{ascending:false}).limit(20)]);
  const att=a.data||[],lv=l.data||[],t=att.find(x=>x.date==today()),days=att.filter(x=>x.date.startsWith(today().slice(0,7))).length;
  const st=!t?'Not clocked in yet':t.clock_out?`Done for today · Out ${tm(t.clock_out)}`:`Clocked in at ${tm(t.clock_in)}${t.status=='late'?' (late)':''}`;
  const btn=!t?`<button class="big in" onclick="clk('clock_in')">CLOCK IN</button>`:!t.clock_out?`<button class="big out" onclick="clk('clock_out')">CLOCK OUT</button>`:`<button class=big disabled>✔ Done for today</button>`;
  render(hdr(me.full_name)+`<main><div class=card><div class=clock id=ck></div><p class=st>${st}</p>${btn}</div>
  <div class=cards><div class=c><b>${days}</b>Days present this month</div><div class=c><b>${lv.filter(x=>x.status=='pending').length}</b>Pending requests</div></div>
  <div class=card><h3>Request leave / permission</h3><form onsubmit="leave(event);return false"><select name=type><option>Leave</option><option>Permission</option></select>
  <label>From</label><input type=date name=date min="${today()}" required><label>To (optional)</label><input type=date name=end_date>
  <textarea name=reason placeholder="Reason" required></textarea><button class=pri>Submit request</button></form></div>
  <div class=card><h3>My requests</h3>${lv.map(x=>`<div class=row><span>${x.type} · ${x.date}${x.end_date?' → '+x.end_date:''}<small>${esc(x.reason)}${x.admin_comment?'<br>💬 '+esc(x.admin_comment):''}</small></span><i class="tag ${x.status}">${x.status}</i></div>`).join('')||'<small>None yet</small>'}</div>
  <div class=card><h3>Attendance history</h3>${att.map(x=>`<div class=row><span>${x.date}<small>In ${tm(x.clock_in)} · Out ${tm(x.clock_out)}</small></span><i class="tag ${x.status}">${x.status}</i></div>`).join('')||'<small>No records yet</small>'}</div></main>`);
  clearInterval(T);const k=()=>{const e=$('#ck');if(e)e.textContent=new Date().toLocaleTimeString('en-NG',{timeZone:tz})};k();T=setInterval(k,1000)}
async function clk(fn){const {error}=await db.rpc(fn);toast(error?(error.code=='23505'?'You already clocked in today':error.message):'Done ✔');staffView()}
async function leave(e){const f=fd(e);if(!f.end_date)delete f.end_date;const {error}=await db.from('leave_requests').insert({...f,staff_id:me.id});toast(error?error.message:'Request sent');staffView()}

// ---------- Admin ----------
async function adminView(){
  const [s,a,l,p,tb]=await Promise.all([db.from('staff').select('*').order('full_name'),db.from('attendance').select('*').eq('date',A.date),
    db.from('leave_requests').select('*,staff(full_name,staff_id)').order('created_at',{ascending:false}).limit(100),db.from('posts').select('*').order('created_at',{ascending:false}).limit(50),db.from('team').select('*').order('category').order('sort_order').order('created_at')]);
  P=p.data||[];TM=tb.data||[];S=s.data||[];AT=a.data||[];LV=l.data||[];draw()}
const rows=()=>S.filter(x=>x.role=='staff').map(x=>{const a=AT.find(t=>t.staff_id==x.id),
  v=LV.find(v=>v.staff_id==x.id&&v.status=='approved'&&v.date<=A.date&&(v.end_date||v.date)>=A.date);return{...x,a,st:a?a.status:v?'leave':'absent'}});
function tbl(){const q=A.q.toLowerCase();
  const r=rows().filter(r=>(!A.dept||r.department==A.dept)&&(r.full_name+r.staff_id).toLowerCase().includes(q));
  return `<table><tr><th>Staff</th><th>Dept</th><th>In</th><th>Out</th><th>Status</th></tr>${r.map(r=>`<tr><td>${esc(r.full_name)}<small>${esc(r.staff_id)}</small></td><td>${esc(r.department)}</td><td>${tm(r.a?.clock_in)}</td><td>${tm(r.a?.clock_out)}</td><td><i class="tag ${r.st}">${r.st}</i></td></tr>`).join('')||'<tr><td colspan=5>No staff found</td></tr>'}</table>`}
function draw(){const r=rows(),n=k=>r.filter(x=>x.st==k).length,pend=LV.filter(v=>v.status=='pending'),t=A.tab;
  let body='';
  if(t=='today')body=`<input type=date value="${A.date}" onchange="A.date=this.value;adminView()">
  <div class=cards style="grid-template-columns:1fr 1fr"><div class=c><b>${n('present')+n('late')}</b>Present</div><div class=c><b>${n('absent')}</b>Absent</div><div class=c><b>${n('late')}</b>Late</div><div class=c><b>${n('leave')}</b>On leave</div></div>
  <div class=card><div class=two><input placeholder="🔍 Search name / ID" value="${esc(A.q)}" oninput="A.q=this.value;$('#tbl').innerHTML=tbl()">
  <select onchange="A.dept=this.value;$('#tbl').innerHTML=tbl()"><option value="">All departments</option>${DEPTS.map(d=>`<option ${A.dept==d?'selected':''}>${d}</option>`).join('')}</select></div>
  <div class=sc id=tbl>${tbl()}</div></div>
  <div class=card><h3>Export attendance</h3><div class=two><input type=month id=mon value="${today().slice(0,7)}"><button class=pri style="margin:5px 0" onclick="exp()">Download CSV</button></div><small>Opens in Excel</small></div>`;
  if(t=='leave')body=`<div class=card><h3>Pending requests</h3>${pend.map(v=>`<div style="padding:8px 0;border-bottom:1px solid #eef"><b>${esc(v.staff?.full_name)}</b> · ${v.type}<small>${v.date}${v.end_date?' → '+v.end_date:''}<br>${esc(v.reason)}</small>
  <input id=c${v.id} placeholder="Comment (optional)"><div class=two><button class=mini style="background:#157a3c" onclick="decide(${v.id},'approved')">Approve</button><button class=mini style="background:#c0392b" onclick="decide(${v.id},'rejected')">Reject</button></div></div>`).join('')||'<small>No pending requests</small>'}</div>
  <div class=card><h3>Recent decisions</h3>${LV.filter(v=>v.status!='pending').slice(0,20).map(v=>`<div class=row><span>${esc(v.staff?.full_name)} · ${v.date}<small>${esc(v.admin_comment||'')}</small></span><i class="tag ${v.status}">${v.status}</i></div>`).join('')||'<small>None</small>'}</div>`;
  if(t=='staff')body=`<div class=card><h3>Add staff</h3><form onsubmit="addStaff(event);return false"><input name=full_name placeholder="Full name" required><input name=phone type=tel placeholder="Phone" required><input name=sid placeholder="Staff ID" required>
  <select name=department required><option value="">Department</option>${DEPTS.map(d=>`<option>${d}</option>`).join('')}</select><input name=pw placeholder="Temporary password" minlength=6 required><button class=pri>Add staff</button></form></div>
  <div class=card><h3>All staff (${S.length})</h3>${S.map(x=>`<div class=row><span>${esc(x.full_name)} ${x.role=='admin'?'⭐':''}<small>${esc(x.staff_id)} · ${esc(x.department)} · ${esc(x.phone)}</small></span>${x.id==me.id?'':`<button class=mini style="background:#c0392b" onclick="rm('${x.id}')">Remove</button>`}</div>`).join('')}</div>`;
  if(t=='posts')body=postsHtml();if(t=='team')body=teamHtml();render(hdr('Admin · '+me.full_name)+`<main><div class=tabs>${[['today','Today'],['leave','Leave'+(pend.length?` (${pend.length})`:'')],['staff','Staff'],['posts','Posts'],['team','Team']].map(([k,l])=>`<button class="${t==k?'on':''}" onclick="A.tab='${k}';draw()">${l}</button>`).join('')}</div>${body}</main>`)}
async function decide(id,status){const {error}=await db.from('leave_requests').update({status,admin_comment:$('#c'+id).value}).eq('id',id);toast(error?error.message:'Saved');adminView()}
async function rm(id){if(!confirm('Remove this staff member and all their records?'))return;const {error}=await db.rpc('remove_staff',{p_id:id});toast(error?error.message:'Removed');adminView()}
async function addStaff(e){const f=fd(e),c2=createClient(URL_,KEY,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'tmp'}});
  const {error}=await c2.auth.signUp({email:em(f.sid),password:f.pw,options:{data:{full_name:f.full_name,phone:f.phone,staff_id:f.sid.trim(),department:f.department}}});
  toast(error?error.message:'Staff added');if(!error)adminView()}
async function exp(){const m=$('#mon').value,[y,mo]=m.split('-'),end=new Date(y,mo,0).getDate();
  const {data,error}=await db.from('attendance').select('*,staff(full_name,staff_id,department)').gte('date',m+'-01').lte('date',`${m}-${end}`).order('date');
  if(error)return toast(error.message);const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const csv=['Staff ID,Name,Department,Date,Clock In,Clock Out,Status',...data.map(r=>[r.staff.staff_id,r.staff.full_name,r.staff.department,r.date,tm(r.clock_in),tm(r.clock_out),r.status].map(q).join(','))].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=`attendance-${m}.csv`;a.click()}
const TY={announcement:'Announcement',blog:'Blog post',social:'Social post'};
const postsHtml=()=>`<div class=card><h3>New public post</h3><form onsubmit="addPost(event);return false"><select name=type><option value=announcement>Announcement</option><option value=blog>Blog post</option><option value=social>Social post</option></select>
<input name=title placeholder="Title" required><textarea name=body rows=5 placeholder="Write the post…" required></textarea><label>Photo (optional)</label><input type=file name=img accept="image/*">
<input name=link_url type=url placeholder="Link, e.g. Facebook/Instagram post (optional)"><button class=pri id=pb>Publish</button></form></div>
<div class=card><h3>Published posts</h3>${P.map(x=>`<div class=row><span>${esc(x.title)}<small>${TY[x.type]} · ${x.created_at.slice(0,10)}</small></span><button class=mini style="background:#c0392b" onclick="delPost(${x.id})">Delete</button></div>`).join('')||'<small>No posts yet</small>'}</div>`;
async function addPost(e){const f=fd(e),b=$('#pb');b.disabled=true;b.textContent='Publishing…';let image_url=null;const file=e.target.img.files[0];
  if(file){const path=Date.now()+'-'+file.name.replace(/[^a-z0-9.]/gi,'_'),u=await db.storage.from('posts').upload(path,file);
    if(u.error){toast(u.error.message);b.disabled=false;b.textContent='Publish';return}image_url=db.storage.from('posts').getPublicUrl(path).data.publicUrl}
  const {error}=await db.from('posts').insert({type:f.type,title:f.title,body:f.body,link_url:f.link_url||null,image_url});toast(error?error.message:'Published ✔');adminView()}
async function delPost(id){if(!confirm('Delete this post?'))return;const {error}=await db.from('posts').delete().eq('id',id);toast(error?error.message:'Deleted');adminView()}
const teamHtml=()=>`<div class=card><h3>Add team member (shown on the public site)</h3><form onsubmit="addMember(event);return false"><input name=name placeholder="Full name, e.g. Mrs A. Adeyemi" required>
<input name=role placeholder="Portfolio, e.g. Vice Principal (Academics)" required><select name=category><option value=management>Management</option><option value=staff>Staff</option></select>
<input name=sort_order type=number min=1 placeholder="Display order (1 = first, optional)"><label>Photo (square or portrait works best)</label><input type=file name=img accept="image/*"><button class=pri id=tb>Add to website</button></form></div>
<div class=card><h3>Current team (${TM.length})</h3>${TM.map(x=>`<div class=row><span>${esc(x.name)}<small>${esc(x.role)} · ${x.category=='management'?'Management':'Staff'}</small></span><button class=mini style="background:#c0392b" onclick="delMember(${x.id})">Remove</button></div>`).join('')||'<small>No one added yet</small>'}</div>`;
async function addMember(e){const f=fd(e),b=$('#tb');b.disabled=true;b.textContent='Saving…';let photo_url=null;const file=e.target.img.files[0];
  if(file){const path='team-'+Date.now()+'-'+file.name.replace(/[^a-z0-9.]/gi,'_'),u=await db.storage.from('posts').upload(path,file);
    if(u.error){toast(u.error.message);b.disabled=false;b.textContent='Add to website';return}photo_url=db.storage.from('posts').getPublicUrl(path).data.publicUrl}
  const {error}=await db.from('team').insert({name:f.name,role:f.role,category:f.category,sort_order:+f.sort_order||0,photo_url});toast(error?error.message:'Added ✔');adminView()}
async function delMember(id){if(!confirm('Remove this person from the website?'))return;const {error}=await db.from('team').delete().eq('id',id);toast(error?error.message:'Removed');adminView()}
init();
</script></body></html>
